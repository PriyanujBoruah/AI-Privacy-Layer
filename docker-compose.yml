services:
  ai-privacy-layer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-privacy-layer
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
