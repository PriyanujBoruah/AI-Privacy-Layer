version: "3.8"

services:
  ai-privacy-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/priyanujboruah/ai-privacy-core:latest
    container_name: ai-privacy-core
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - OPENAI_BASE_URL=https://api.openai.com/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
