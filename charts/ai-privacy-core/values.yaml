# Default values for ai-privacy-core Helm chart.
# Production-ready defaults configured for zero-trust private VPC and Kubernetes clusters.

replicaCount: 2

image:
  repository: ghcr.io/priyanujboruah/ai-privacy-core
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8787"
  prometheus.io/path: "/health"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8787

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: privacy-gateway.internal.enterprise.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# Environment variables passed to the gateway
env:
  PORT: "8787"
  NODE_ENV: "production"
  STORAGE_MODE: "memory_only"
  OPENAI_BASE_URL: "https://api.openai.com/v1"

# Sensitive secrets (API keys) can be mounted from an existing Kubernetes secret
secretEnv:
  enabled: false
  secretName: "ai-privacy-core-secrets"
  openaiApiKeyKey: "OPENAI_API_KEY"
  geminiApiKeyKey: "GEMINI_API_KEY"

nodeSelector: {}
tolerations: []
affinity: {}
